[project]
name = "deep-agents"
version = "0.2.0"
description = "Autonomous multi-agent career suite — ATS resume tailoring, job search, and interview prep powered by LangGraph."
readme = "README.md"
authors = [
    { name = "Viplove0114", email = "viplovethakran4@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # --- Core Agent Framework ---
    "deepagents>=0.7.13",
    "langchain>=1.4.0",
    "langchain-quickjs>=0.3.6",
    # --- LLM Providers ---
    "langchain-google-genai>=2.1.0",   # Gemini 3.8 Flash + Gemma 4 31B
    "langchain-openrouter>=0.2.0",     # Qwen 3.8 27B (primary)
    "langchain-groq>=0.3.0",           # Qwen 3.8 27B (fallback when OpenRouter is down)
    # --- Document Parsing ---
    "pypdf>=5.0.0",                     # PDF resume parsing (pure Python, no DLL issues)
    "python-docx>=1.1.0",             # DOCX resume parsing + export
    # --- Document Export ---
    "weasyprint>=63.0",                # Markdown → HTML → PDF export
    "markdown>=3.7",                   # Markdown → HTML conversion
    # --- Data Export ---
    "openpyxl>=3.1.0",                 # Excel export for job search results
    # --- Search & Web ---
    "tavily-python>=0.8.1",            # Web search tool
    # --- Utilities ---
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    # --- Development ---
    "ipykernel>=7.3.0",
]

[project.scripts]
deep-agents = "deep_agents:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
