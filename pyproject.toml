description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Viplove0114", email = "viplovethakran4@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.13",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
